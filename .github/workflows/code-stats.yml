name: code stats

on:
  schedule:
    - cron: "17 */4 * * *"  # every 4 hours
    - cron: "53 6 * * *"    # 23:53 PDT, last run of the day in summer
    - cron: "53 7 * * *"    # 23:53 PST, last run of the day in winter
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [code-push]       # optional: sent from tracked repos on push
  push:
    branches: [main]
    paths: [stats/tokens.json] # new token totals from report-tokens

permissions:
  contents: write

concurrency:
  group: code-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: collector/go.mod
          cache: false

      - name: Collect stats and render widget
        working-directory: collector
        env:
          CODE_STATS_REPOS: ${{ secrets.CODE_STATS_REPOS }} # repos to count; a secret so the log shows ***
          CODE_STATS_TOKEN: ${{ secrets.CODE_STATS_TOKEN }} # read access to private repos
        run: go run . -root ..

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore: update code stats"
          # report-tokens may have pushed tokens.json meanwhile; it touches no file we write.
          git pull --rebase
          git push
